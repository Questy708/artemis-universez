name = "artemis-universez"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]
send_metrics = false

# D1 Database binding
[[d1_databases]]
binding = "D1_DATABASE"
database_name = "artemis-lms-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# KV namespace for rate limiting (optional but recommended)
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Secrets (set via: wrangler pages secret put ADMIN_PASSWORD)
# Do NOT put ADMIN_PASSWORD here — use Cloudflare dashboard or CLI:
#   wrangler pages secret put ADMIN_PASSWORD --project-name artemis-universez
